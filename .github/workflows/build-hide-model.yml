name: Build custom image (hide upstream model)

on:
  push:
    branches: [hide-upstream-model]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mazongyy/new-api-custom:hide-model

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build image
        run: |
          docker build -t "$IMAGE" .

      - name: Push image
        run: docker push "$IMAGE"

      - name: Export image tarball
        run: docker save "$IMAGE" | gzip > new-api-custom-hide-model.tar.gz

      - name: Upload image tarball
        uses: actions/upload-artifact@v4
        with:
          name: new-api-custom-hide-model
          path: new-api-custom-hide-model.tar.gz
          retention-days: 7
