name: Build custom image (hide upstream model)

on:
  push:
    branches: [hide-upstream-model]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mazongyy/new-api-custom:hide-model

jobs:
  build:
    # 春川服务器为 aarch64，用 GitHub 免费 ARM 原生 runner 构建 linux/arm64 镜像
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 多架构：arm64（春川主机）+ amd64（c1/c2 x86 副本）
      # bun/go 阶段已钉 BUILDPLATFORM，原生构建后交叉编译，仅最终 debian 层走 QEMU
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build & push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ env.IMAGE }}

      - name: Export image tarball
        run: |
          docker pull --platform linux/arm64 "$IMAGE"
          docker save "$IMAGE" | gzip > new-api-custom-hide-model.tar.gz

      - name: Upload image tarball
        uses: actions/upload-artifact@v4
        with:
          name: new-api-custom-hide-model
          path: new-api-custom-hide-model.tar.gz
          retention-days: 7
